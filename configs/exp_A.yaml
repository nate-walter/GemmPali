name: exp_A_gemma3_minrisk
track: A
objective: "Establish stable Gemma3-based multi-page retriever baseline with minimal architectural surgery"
model:
  backbone: google/gemma-3-27b-it
  family: gemma3
  precision: bfloat16
training:
  stage: contrastive_warmup
  max_steps: 600
  train_batch_size: 2
  eval_batch_size: 2
  grad_accum: 16
  learning_rate: 3e-5
  warmup_steps: 60
  lr_scheduler_type: cosine
  weight_decay: 0.01
  eval_steps: 50
  save_steps: 150
  logging_steps: 25
  max_length: 1024
  early_stop_patience: 6
retrieval:
  embed_dim: 128
  pool_factor: 4
  use_negatives: true
  num_negatives: 1
gates:
  - "No OOM in first 100 steps"
  - "Single-page retrieval parity with current baseline"
  - "Cross-page benchmark > random + clear upward trend"
artifacts:
  - Reports/exp_A_metrics.json
  - Reports/exp_A_metrics.md
