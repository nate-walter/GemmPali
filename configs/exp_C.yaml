name: exp_C_gemma3_maxupside
track: C
objective: "Maximize multi-page retrieval with aggressive optimization and judge-guided RL"
model:
  backbone: google/gemma-3-27b-it
  family: gemma3
  precision: bfloat16
patches:
  rope_mode: volumetric_3d
  mask_mode: omni_for_indexing
  pooling_factor: 8
training:
  stage: full_hybrid_rl
  max_steps: 2500
  train_batch_size: 4
  eval_batch_size: 4
  grad_accum: 8
  learning_rate: 2e-5
  warmup_steps: 250
  lr_scheduler_type: cosine
  weight_decay: 0.01
  eval_steps: 100
  save_steps: 200
  logging_steps: 50
  max_length: 768
  early_stop_patience: 10
retrieval:
  embed_dim: 128
  use_negatives: true
  num_negatives: 1
judge:
  mode: dispo_plus_cprog
  reward_components:
    retrieval_rank: 0.5
    cross_page_consistency: 0.3
    hallucination_penalty: 0.2
risk_controls:
  - "Hard stop on OOM"
  - "Hard stop on eval regression 3 checks in a row"
  - "Fallback to exp_B config if instability detected"
artifacts:
  - Reports/exp_C_metrics.json
  - Reports/exp_C_metrics.md
