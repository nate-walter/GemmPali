name: exp_B_gemma3_3drope_patch
track: B
objective: "Enable stronger multi-page geometry awareness with moderate-risk patch set"
model:
  backbone: google/gemma-3-27b-it
  family: gemma3
  precision: bfloat16
patches:
  rope_mode: volumetric_3d
  mask_mode: omni_for_indexing
  fallback_if_fail: learned_page_embedding
training:
  stage: contrastive_plus_light_rl
  max_steps: 1200
  train_batch_size: 2
  eval_batch_size: 2
  grad_accum: 16
  learning_rate: 2e-5
  warmup_steps: 120
  lr_scheduler_type: cosine
  weight_decay: 0.01
  eval_steps: 100
  save_steps: 150
  logging_steps: 50
  max_length: 1024
  early_stop_patience: 8
retrieval:
  embed_dim: 128
  pool_factor: 4
  use_negatives: true
  num_negatives: 1
judge:
  mode: hybrid
  dispo_weight: 0.5
  cprog_weight: 0.3
  retrieval_weight: 0.2
gates:
  - "Patch compiles and shape assertions pass"
  - "2-page/4-page metrics exceed exp_A"
  - "No instability spikes (grad_norm runaway)"
artifacts:
  - Reports/exp_B_metrics.json
  - Reports/exp_B_metrics.md
